<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeGuard AI | Security & Code Review</title>
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom scrollbar for the code editor to look professional */
        .code-editor::-webkit-scrollbar { width: 8px; height: 8px; }
        .code-editor::-webkit-scrollbar-track { background: #1e293b; }
        .code-editor::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-900 text-slate-200 font-sans min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-slate-800 border-b border-slate-700 p-4 shadow-md">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold text-emerald-400 tracking-wide">CodeGuard AI</h1>
                <p class="text-sm text-slate-400">Automated Security & Code Review</p>
            </div>
            
            <!-- Demo Mode Toggle UI (Logic added later) -->
            <div class="flex items-center gap-3 bg-slate-900 px-4 py-2 rounded-lg border border-slate-700">
                <span class="text-sm font-medium text-slate-300">Live API Mode</span>
                <button id="mode-toggle" class="relative inline-flex h-6 w-11 items-center rounded-full bg-slate-600 transition-colors">
                    <span class="inline-block h-4 w-4 transform rounded-full bg-white transition translate-x-1"></span>
                </button>
                <span class="text-sm font-medium text-amber-400/50">Demo Mode</span>
            </div>
        </div>
    </header>

    <!-- Main Workspace -->
    <main class="flex-grow max-w-7xl mx-auto w-full p-4 grid grid-cols-1 lg:grid-cols-2 gap-6 mt-4">
        
        <!-- Left Column: Code Input -->
        <section class="flex flex-col gap-4">
            <div class="flex justify-between items-end">
                <div>
                    <label class="block text-sm font-medium text-slate-400 mb-1">Language</label>
                    <select id="language-select" class="bg-slate-800 border border-slate-600 text-slate-200 rounded-md px-3 py-1.5 focus:outline-none focus:ring-2 focus:ring-emerald-500">
                        <option value="python">Python</option>
                        <option value="javascript">JavaScript</option>
                        <option value="java">Java</option>
                    </select>
                </div>
                <button id="load-sample-btn" class="text-sm text-emerald-400 hover:text-emerald-300 underline underline-offset-2">
                    Load Sample Vulnerability
                </button>
            </div>

            <textarea id="code-input" spellcheck="false" class="code-editor flex-grow w-full h-[400px] bg-slate-950 text-emerald-300 font-mono text-sm p-4 rounded-lg border border-slate-700 focus:outline-none focus:border-emerald-500 resize-none shadow-inner" placeholder="# Paste your source code here for review..."></textarea>
            
            <button id="submit-btn" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3 px-4 rounded-lg shadow-lg transition-colors flex justify-center items-center gap-2">
                <svg id="btn-spinner" class="animate-spin h-5 w-5 hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                <span id="btn-text">Run Security Review</span>
            </button>
        </section>

        <!-- Right Column: Results -->
        <section class="flex flex-col gap-4 h-full">
            <h2 class="text-lg font-semibold text-slate-300 border-b border-slate-700 pb-2">Active Findings</h2>
            
            <div id="results-container" class="flex-grow bg-slate-800 rounded-lg border border-slate-700 p-6 overflow-y-auto max-h-[460px] flex flex-col justify-center items-center text-center">
                <!-- Empty State -->
                <svg class="w-16 h-16 text-slate-600 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                <p class="text-slate-400 font-medium">Ready to analyze</p>
                <p class="text-sm text-slate-500 mt-1">Submit code to scan for bugs, security risks, and anti-patterns.</p>
            </div>
        </section>
    </main>

    <!-- Bottom History Panel (Placeholder for now) -->
    <section class="max-w-7xl mx-auto w-full p-4 mt-4">
        <h2 class="text-lg font-semibold text-slate-300 mb-4 border-b border-slate-700 pb-2">Review History</h2>
        <div id="history-container" class="bg-slate-800 rounded-lg border border-slate-700 p-4">
            <p class="text-sm text-slate-500 text-center italic">Past reviews will load here.</p>
        </div>
    </section>
    <script src="/static/js/app.js"></script>
</body>
</html>
